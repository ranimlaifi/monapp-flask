<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Sécurité Cloud</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- Nuages animés -->
    <img src="{{ url_for('static', filename='img/cloud1.png') }}" class="cloud cloud1">
    <img src="{{ url_for('static', filename='img/cloud2.png') }}" class="cloud cloud2">
    <img src="{{ url_for('static', filename='img/cloud3.png') }}" class="cloud cloud3">

    <div class="container py-5">

        <h1 class="text-center text-white animate__animated animate__fadeInDown">
            🔐 Dashboard Sécurité - Cloud & API
        </h1>

        <p class="text-center text-white animate__animated animate__fadeInUp">
            Suivi en temps réel des accès API (200 - 403 - 404)
        </p>

        <div class="row mt-4">

            <div class="col-md-4">
                <div class="card p-3 text-center bg-success text-white shadow">
                    <h3>✔️ 200 - Autorisés</h3>
                    <p id="count-200" class="display-5">{{ stats['200'] }}</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center bg-danger text-white shadow">
                    <h3>❌ 403 - Refusés</h3>
                    <p id="count-403" class="display-5">{{ stats['403'] }}</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center bg-warning text-dark shadow">
                    <h3>⚠️ 404 - Not Found</h3>
                    <p id="count-404" class="display-5">{{ stats['404'] }}</p>
                </div>
            </div>

        </div>

        <div class="mt-5 card p-4 bg-white shadow animate__animated animate__fadeInUp">
            <h4 class="text-center">📊 Graphique des Requêtes API</h4>
            <canvas id="requestsChart" height="120"></canvas>
        </div>

    </div>

    <script>
        const ctx = document.getElementById('requestsChart').getContext('2d');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['200 OK', '403 Refusé', '404 Not Found'],
                datasets: [{
                    label: 'Nombre de requêtes',
                    data: [{{ stats['200'] }}, {{ stats['403'] }}, {{ stats['404'] }}],
                    backgroundColor: [
                        'rgba(40, 180, 99, 0.7)',
                        'rgba(231, 76, 60, 0.7)',
                        'rgba(241, 196, 15, 0.7)'
                    ],
                    borderColor: ['#28b463', '#e74c3c', '#f1c40f'],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                animation: {
                    duration: 800
                }
            }
        });
    </script>

</body>
</html>
